    <link rel="stylesheet" href="../../../shared/css/tokens.css">
    <link rel="stylesheet" href="../../../shared/css/base.css">

    <link rel="stylesheet" href="../../../shared/css/components.css">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Spanish verb conjugation reference across tenses and moods.">
    <link rel="canonical" href="https://cosylanguages.github.io/COSYtools/tools/es/conjugeur/index.html">
    <meta property="og:image" content="https://cosylanguages.github.io/COSYtools/shared/images/cosylanguages.png">
</head>
<body>

    <!-- Shared Ecosystem Strip -->
<div class="cosy-ecosystem-strip" role="navigation" aria-label="COSY Ecosystem Products">
  <div class="cosy-strip-inner">
    <span class="cosy-strip-brand">🌐 COSY Ecosystem:</span>
    <ul class="cosy-strip-links">
      <li><a href="https://cosylanguages.github.io/COSYlanguages/" class="cosy-strip-link">COSYlanguages 🏠</a></li>
      <li><a href="https://cosylanguages.github.io/COSYdata/" target="_blank" rel="noopener" class="cosy-strip-link">COSYdata 📊</a></li>
      <li><a href="../../../index.html" class="cosy-strip-link active">COSYtools 🔎</a></li>
      <li><a href="https://cosylanguages.github.io/COSYgames/" target="_blank" rel="noopener" class="cosy-strip-link">COSYgames 🎮</a></li>
      <li><a href="https://cosylanguages.github.io/COSYevents/" target="_blank" rel="noopener" class="cosy-strip-link">COSYevents 🎉</a></li>
    </ul>
    <button id="cosy-theme-toggle" class="cosy-theme-toggle-btn" aria-label="Cambiar tema" style="background:none; border:none; cursor:pointer; font-size:1.1rem; padding:0.2rem 0.5rem; margin-left:auto;">🌙</button>
  </div>
</div>
    <header class="app-header" data-icon="🇪🇸" data-title="Conjugación Española" data-tagline="Spanish Verb Engine"></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="verb-search-input" placeholder="Buscar verbo en español (ej. hablar, comer, vivir)..." aria-label="Search verb or entry">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="verb-display" class="result-card"></div>

        <section class="practice-panel" aria-labelledby="practice-title">
            <div class="practice-heading">
                <div>
                    <span class="practice-kicker">Práctica</span>
                    <h2 id="practice-title">Formas irregulares</h2>
                </div>
                <span id="practice-family" class="practice-family"></span>
            </div>
            <p id="practice-prompt" class="practice-prompt"></p>
            <div class="practice-controls">
                <input id="practice-answer" type="text" autocomplete="off" placeholder="Escribe la forma..." aria-label="Type practice answer">
                <button id="practice-check" type="button">Comprobar</button>
                <button id="practice-next" type="button" class="secondary">Nueva forma</button>
            </div>
            <p id="practice-feedback" class="practice-feedback" aria-live="polite"></p>
        </section>
    </main>
    <script src="../../../shared/js/languages.js"></script>
    <script src="../../../shared/js/shell.js" defer></script>
    <script>
        const lang = 'es';
        fetch('data/verbs.json').then(r => r.json()).then(async db => {
            const input = document.getElementById('verb-search-input');
            const display = document.getElementById('verb-display');

            let indexHeadwords = [];
            try {
                const indexData = await window.COSYSupplementalLexicon.loadIndex(lang);
                indexHeadwords = indexData.headwords || [];
            } catch (e) {}

            const allLemmas = [...new Set([...Object.keys(db), ...indexHeadwords])];

            async function render(v) {
                if (!v) return;
                const normV = v.trim().toLowerCase();
                const dbKey = Object.keys(db).find(k => k.toLowerCase() === normV);
                const item = dbKey ? db[dbKey] : null;

                const morphUnit = await window.COSYSupplementalLexicon.getUnitByLemma(lang, v);
                const tableHtml = (morphUnit && window.COSYConjugationTable) ? window.COSYConjugationTable.buildTable(morphUnit, lang) : null;

                if (item) {
                    let html = `<h2 style="margin-top:0;">${dbKey} <span class="tag">${item.level || 'A1'}</span></h2>`;
                    if (item.definition) html += `<p><strong>Definición:</strong> ${item.definition}</p>`;
                    if (item.examples && item.examples.length > 0) html += `<p><strong>Ejemplo:</strong> ${item.examples[0]}</p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                if (morphUnit) {
                    let html = `<h2 style="margin-top:0;">${morphUnit.lemma} <span class="tag">UniMorph</span></h2>`;
                    if (morphUnit.source_url) html += `<p><strong>Fuente:</strong> <a href="${morphUnit.source_url}" target="_blank" rel="noopener">${morphUnit.source_url}</a></p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                display.innerHTML = `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic;">Full conjugation table not available for this verb yet.</p>`;
            }

            const irregular = Object.entries(db).filter(([verb, item]) => item.group === 'Irregular' || verb === 'leer');
            const prompt = document.getElementById('practice-prompt');
            const answer = document.getElementById('practice-answer');
            const feedback = document.getElementById('practice-feedback');
            const family = document.getElementById('practice-family');
            let currentQuestion = null;

            const families = {
                estar: 'Radical en u: estuve',
                ser: 'Supplétif: fui',
                ir: 'Supplétif: fui',
                tener: 'Radical en u: tuve',
                hacer: 'Radical en i: hice / hizo',
                ver: 'Prétérit court: vi',
                poder: 'Radical en u: pude',
                querer: 'Radical en i: quise',
                saber: 'Radical en u: supe',
                leer: 'Alternance en y: leyó / leyeron'
            };

            function newQuestion() {
                if (!irregular.length) return;
                const [verb, item] = irregular[Math.floor(Math.random() * irregular.length)];
                const tense = Math.random() < 0.5 ? 'presente' : 'pasado';
                const personIndex = Math.floor(Math.random() * item.tenses[tense].length);
                const labels = ['yo', 'tú', 'él/ella', 'nosotros', 'vosotros', 'ellos'];
                currentQuestion = { verb, item, tense, person: labels[personIndex], expected: item.tenses[tense][personIndex] };
                prompt.textContent = `${verb} · ${tense} · ${currentQuestion.person}`;
                family.textContent = families[verb] || 'Forma irregular';
                answer.value = '';
                feedback.textContent = '';
                answer.focus();
            }

            function checkAnswer() {
                if (!currentQuestion) return;
                const isCorrect = answer.value.trim().toLowerCase() === currentQuestion.expected.toLowerCase();
                feedback.className = `practice-feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                feedback.textContent = isCorrect
                    ? `¡Correcto! ${currentQuestion.expected}`
                    : `Respuesta: ${currentQuestion.expected}`;
            }

            document.getElementById('practice-check').addEventListener('click', checkAnswer);
            document.getElementById('practice-next').addEventListener('click', newQuestion);
            answer.addEventListener('keydown', event => {
                if (event.key === 'Enter') checkAnswer();
            });

            const initialVerb = Object.keys(db)[0] || allLemmas[0];
            if (initialVerb) render(initialVerb);
            newQuestion();

            input.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (!q) return;
                const match = allLemmas.find(lemma => lemma.toLowerCase().startsWith(q) || lemma.toLowerCase() === q);
                if (match) render(match);
            });
        });
    </script>
