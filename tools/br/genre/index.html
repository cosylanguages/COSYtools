    <header class="app-header" data-icon="🏴" data-title="Brezhoneg" data-tagline="Breton Noun Gender Engine"><h1>Rizh an Anvioù</h1></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search entries">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="result-display" class="result-card"></div>
    </main>
    <script src="../../../shared/js/languages.js"></script>
    <script src="../../../shared/js/shell.js" defer></script>
    <script>
        const dataFile = location.pathname.includes('cases') || location.pathname.includes('genus') || location.pathname.includes('genre') ? 'data/nouns.json' : 'data/verbs.json';
        fetch(dataFile).then(r => { if (!r.ok) throw new Error('Data coming soon'); return r.json(); }).then(db => {
          if (!db || Object.keys(db).length === 0) {
              const display = document.getElementById('result-display') || document.getElementById('verb-display');
              if (display) display.innerHTML = '<h1>Data coming soon</h1><p>This language tool is under active development.</p>';
              return;
          }
            const input = document.getElementById('search-input');
            const display = document.getElementById('result-display');
            function render(v) {
                const item = db[v];
                if (!item) return;
                display.innerHTML = `<h2>${v} <span class="tag">${item.level || 'A1'}</span></h2><p><strong>Definition:</strong> ${item.definition || ''}</p><p><strong>Example:</strong> ${item.examples ? item.examples[0] : ''}</p>`;
            }
            const firstKey = Object.keys(db)[0];
            if (firstKey) render(firstKey);
            input.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (db[q]) render(q);
            });
        }).catch(err => {
          const display = document.getElementById('result-display') || document.getElementById('verb-display');
          if (display) display.innerHTML = '<h2>Data coming soon</h2><p>This language tool is under active development.</p>';
      });
    </script>
