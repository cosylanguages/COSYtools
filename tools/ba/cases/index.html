<!DOCTYPE html>
<html lang="ba">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashkir noun case declensions | COSYtools</title>
    <link rel="stylesheet" href="../../../shared/css/cosy-tokens.css">
    <link rel="stylesheet" href="../../../shared/css/tokens.css">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/tool-lookup.css">
    <link rel="stylesheet" href="../../../shared/css/components.css">
    <style>
        .cases-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .cases-table th, .cases-table td {
            border: 1px solid var(--color-border, #ccc);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        .cases-table th {
            background-color: var(--color-bg-subtle, #f5f5f5);
        }
    </style>
    <meta name="description" content="Bashkir noun case declension reference guide and ending rules.">
    <link rel="canonical" href="https://cosylanguages.github.io/COSYtools/tools/ba/cases/index.html">
    <meta property="og:image" content="https://cosylanguages.github.io/COSYtools/shared/images/cosylanguages.png">
</head>
<body>

    <!-- Shared Ecosystem Strip -->
    <div class="cosy-ecosystem-strip" role="navigation" aria-label="COSY Ecosystem Products">
      <div class="cosy-strip-inner">
        <span class="cosy-strip-brand">🌐 COSY Ecosystem:</span>
        <ul class="cosy-strip-links">
          <li><a href="https://cosylanguages.github.io/COSYlanguages/" class="cosy-strip-link">COSYlanguages 🏠</a></li>
          <li><a href="https://cosylanguages.github.io/COSYdata/" target="_blank" rel="noopener" class="cosy-strip-link">COSYdata 📊</a></li>
          <li><a href="../../../index.html" class="cosy-strip-link active">COSYtools 🔎</a></li>
          <li><a href="https://cosylanguages.github.io/COSYgames/" target="_blank" rel="noopener" class="cosy-strip-link">COSYgames 🎮</a></li>
        </ul>
      </div>
    </div>
    <header class="app-header" data-icon="🏴" data-title="Башҡортса" data-tagline="Bashkir Case Engine"></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search entries">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="result-display" class="result-card"></div>
    </main>
    <script src="../../../shared/js/languages.js"></script>
    <script src="../../../shared/js/engine.js"></script>
    <script src="../../../shared/js/ui.js"></script>

    <script>
        const caseLabels = {
            nom: 'Nominative (Төп)',
            gen: 'Genitive (Илек)',
            dat: 'Dative (Төшөм/Тб)',
            acc: 'Accusative (Төшөм)',
            abl: 'Ablative (Сығыш)',
            loc: 'Locative (Урын-ваҡыт)'
        };

        const dataFile = location.pathname.includes('cases') || location.pathname.includes('genus') || location.pathname.includes('genre') ? 'data/nouns.json' : 'data/verbs.json';
        fetch(dataFile).then(r => { if (!r.ok) throw new Error('Data coming soon'); return r.json(); }).then(db => {
          if (!db || Object.keys(db).length === 0) {
              const display = document.getElementById('result-display') || document.getElementById('verb-display');
              if (display) display.innerHTML = '<h1>Data coming soon</h1><p>This language tool is under active development.</p>';
              return;
          }
            const input = document.getElementById('search-input');
            const display = document.getElementById('result-display');
            function render(v) {
                const item = db[v];
                if (!item) return;

                let casesHtml = '';
                if (item.cases) {
                    const prefixes = ['nom', 'gen', 'dat', 'acc', 'abl', 'loc'];
                    let rows = '';
                    prefixes.forEach(p => {
                        const sing = item.cases[p + '_sing'] || item.cases[p] || '-';
                        const plur = item.cases[p + '_plur'] || '-';
                        const label = caseLabels[p] || p.toUpperCase();
                        rows += `<tr><td><strong>${label}</strong></td><td>${sing}</td><td>${plur}</td></tr>`;
                    });
                    casesHtml = `
                        <h3>Case Declension</h3>
                        <table class="cases-table">
                            <thead>
                                <tr>
                                    <th>Case</th>
                                    <th>Singular (Берлек)</th>
                                    <th>Plural (Күплек)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    `;
                }

                display.innerHTML = `
                    <h2>${v} <span class="tag">${item.level || 'A1'}</span>${item.needs_review ? ' <span class="tag" style="background:#e74c3c;color:#fff;">Needs Review</span>' : ''}</h2>
                    <p><strong>Definition:</strong> ${item.definition || ''}</p>
                    <p><strong>Example:</strong> ${item.examples ? item.examples[0] : ''}</p>
                    ${casesHtml}
                `;
            }
            const firstKey = Object.keys(db)[0];
            if (firstKey) render(firstKey);
            input.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (db[q]) render(q);
            });
        }).catch(err => {
          const display = document.getElementById('result-display') || document.getElementById('verb-display');
          if (display) display.innerHTML = '<h2>Data coming soon</h2><p>This language tool is under active development.</p>';
      });
    </script>
    <!-- Shared Shell Footer -->
    <footer class="app-footer cosy-footer">
      <div class="cosy-footer-inner" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; text-align: center; color: var(--ink-soft, #666);">
        <p>🌿 <strong>COSYtools</strong> — Language reference tools across 14 languages. 100% client-side &amp; private.</p>
        <p><small>© COSYlanguages. Open language reference tools.</small></p>
      </div>
    </footer>
</body>
</html>
