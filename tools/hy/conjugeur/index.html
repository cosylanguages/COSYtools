    <!-- Shared Ecosystem Strip -->
<div class="cosy-ecosystem-strip" role="navigation" aria-label="COSY Ecosystem Products">
  <div class="cosy-strip-inner">
    <span class="cosy-strip-brand">🌐 COSY Ecosystem:</span>
    <ul class="cosy-strip-links">
      <li><a href="https://cosylanguages.github.io/COSYlanguages/" class="cosy-strip-link">COSYlanguages 🏠</a></li>
      <li><a href="https://cosylanguages.github.io/COSYdata/" target="_blank" rel="noopener" class="cosy-strip-link">COSYdata 📊</a></li>

    <button id="cosy-theme-toggle" class="cosy-theme-toggle-btn" aria-label="Switch theme" style="background:none; border:none; cursor:pointer; font-size:1.1rem; padding:0.2rem 0.5rem; margin-left:auto;">🌙</button>
  </div>
</div>
    <header class="app-header" data-icon="🇦🇲" data-title="Հայերեն" data-tagline="Armenian Verb Engine"></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search entries">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="result-display" class="result-card"></div>
    </main>
    <script src="../../../shared/js/languages.js"></script>
    <script src="../../../shared/js/shell.js" defer></script>
    <script>
        const lang = 'hy';
        const dataFile = location.pathname.includes('cases') || location.pathname.includes('genus') || location.pathname.includes('genre') ? 'data/nouns.json' : 'data/verbs.json';
        fetch(dataFile).then(r => r.ok ? r.json() : {}).then(async db => {
            const input = document.getElementById('search-input');
            const display = document.getElementById('result-display') || document.getElementById('verb-display');

            let indexHeadwords = [];
            try {
                const indexData = await window.COSYSupplementalLexicon.loadIndex(lang);
                indexHeadwords = indexData.headwords || [];
            } catch (e) {}

            const allLemmas = [...new Set([...Object.keys(db || {}), ...indexHeadwords])];

            async function render(v) {
                if (!v) return;
                const normV = v.trim().toLowerCase();
                const dbKey = Object.keys(db || {}).find(k => k.toLowerCase() === normV);
                const item = dbKey ? db[dbKey] : null;

                const morphUnit = await window.COSYSupplementalLexicon.getUnitByLemma(lang, v);
                const tableHtml = (morphUnit && window.COSYConjugationTable) ? window.COSYConjugationTable.buildTable(morphUnit, lang) : null;

                if (item) {
                    let html = `<h2 style="margin-top:0;">${dbKey} <span class="tag">${item.level || 'A1'}</span></h2>`;
                    if (item.definition) html += `<p><strong>Definition:</strong> ${item.definition}</p>`;
                    if (item.examples && item.examples.length > 0) html += `<p><strong>Example:</strong> ${item.examples[0]}</p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                if (morphUnit) {
                    let html = `<h2 style="margin-top:0;">${morphUnit.lemma} <span class="tag">UniMorph</span></h2>`;
                    if (morphUnit.source_url) html += `<p><strong>Source:</strong> <a href="${morphUnit.source_url}" target="_blank" rel="noopener">${morphUnit.source_url}</a></p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                display.innerHTML = `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic;">Full conjugation table not available for this verb yet.</p>`;
            }

            const initialVerb = Object.keys(db || {})[0] || allLemmas[0];
            if (initialVerb) {
                render(initialVerb);
            } else {
                display.innerHTML = '<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic;">Full conjugation table not available for this verb yet.</p>';
            }

            if (input) {
                input.addEventListener('input', event => {
                    const query = event.target.value.trim().toLowerCase();
                    if (!query) return;
                    const match = allLemmas.find(lemma => lemma.toLowerCase().startsWith(query) || lemma.toLowerCase() === query);
                    if (match) render(match);
                });
            }
        });
    </script>
