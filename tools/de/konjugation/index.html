    <header class="app-header" data-icon="🇩🇪" data-title="Deutsch" data-tagline="German Verb Conjugation Engine"><h1>Deutsche Verbkonjugation</h1></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search entries">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="result-display" class="result-card"></div>

        <section class="practice-panel" aria-labelledby="practice-title">
            <div class="practice-heading">
                <div>
                    <span class="practice-kicker">Übung</span>
                    <h2 id="practice-title">Unregelmäßige Formen üben</h2>
                </div>
                <span id="practice-family" class="practice-family"></span>
            </div>
            <p id="practice-prompt" class="practice-prompt"></p>
            <div class="practice-controls">
                <input id="practice-answer" type="text" autocomplete="off" placeholder="Form eingeben..." aria-label="Type practice answer">
                <button id="practice-check" type="button">Prüfen</button>
                <button id="practice-next" type="button" class="secondary">Neue Form</button>
            </div>
            <p id="practice-feedback" class="practice-feedback" aria-live="polite"></p>
        </section>
    </main>
    <script src="../../../shared/js/languages.js"></script>
    <script src="../../../shared/js/shell.js" defer></script>
    <script>
        const lang = 'de';
        const dataFile = location.pathname.includes('cases') || location.pathname.includes('genus') || location.pathname.includes('genre') ? 'data/nouns.json' : 'data/verbs.json';
        fetch(dataFile).then(r => r.json()).then(async db => {
            const input = document.getElementById('search-input');
            const display = document.getElementById('result-display');

            let indexHeadwords = [];
            try {
                const indexData = window.COSYSupplementalLexicon ? await window.COSYSupplementalLexicon.loadIndex(lang) : null;
                indexHeadwords = indexData.headwords || [];
            } catch (e) {}

            const allLemmas = [...new Set([...Object.keys(db), ...indexHeadwords])];

            async function render(v) {
                if (!v) return;
                const normV = v.trim().toLowerCase();
                const dbKey = Object.keys(db).find(k => k.toLowerCase() === normV);
                const item = dbKey ? db[dbKey] : null;

                const morphUnit = window.COSYSupplementalLexicon ? await window.COSYSupplementalLexicon.getUnitByLemma(lang, v) : null;
                const tableHtml = (morphUnit && window.COSYConjugationTable) ? window.COSYConjugationTable.buildTable(morphUnit, lang) : null;

                if (item) {
                    let html = `<h2 style="margin-top:0;">${dbKey} <span class="tag">${item.level || 'A1'}</span></h2>`;
                    if (item.definition) html += `<p><strong>Definition:</strong> ${item.definition}</p>`;
                    if (item.examples && item.examples.length > 0) html += `<p><strong>Beispiel:</strong> ${item.examples[0]}</p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                if (morphUnit) {
                    let html = `<h2 style="margin-top:0;">${morphUnit.lemma} <span class="tag">UniMorph</span></h2>`;
                    if (morphUnit.source_url) html += `<p><strong>Quelle:</strong> <a href="${morphUnit.source_url}" target="_blank" rel="noopener">${morphUnit.source_url}</a></p>`;

                    if (tableHtml) {
                        html += tableHtml;
                    } else {
                        html += `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic; margin-top: 1rem;">Full conjugation table not available for this verb yet.</p>`;
                    }
                    display.innerHTML = html;
                    return;
                }

                display.innerHTML = `<p class="table-unavailable" style="color: var(--ink-soft, #666); font-style: italic;">Full conjugation table not available for this verb yet.</p>`;
            }

            const irregular = Object.entries(db).filter(([, item]) => item.group === 'Unregelmäßiges Verb');
            const prompt = document.getElementById('practice-prompt');
            const answer = document.getElementById('practice-answer');
            const feedback = document.getElementById('practice-feedback');
            const family = document.getElementById('practice-family');
            let currentQuestion = null;

            function familyLabel(verb) {
                return verb === 'sein' ? 'Suppletive: bin – war' : 'Vokalwechsel: habe – hatte';
            }

            function newQuestion() {
                if (irregular.length === 0) return;
                const [verb, item] = irregular[Math.floor(Math.random() * irregular.length)];
                const tense = Math.random() < 0.5 ? 'präsens' : 'präteritum';
                const personIndex = Math.floor(Math.random() * item.tenses[tense].length);
                const parts = item.tenses[tense][personIndex].split(' ');
                currentQuestion = { verb, item, tense, person: parts[0], expected: parts.slice(1).join(' ') };
                prompt.textContent = `${verb} · ${tense} · ${currentQuestion.person}`;
                family.textContent = familyLabel(verb);
                answer.value = '';
                feedback.textContent = '';
                answer.focus();
            }

            function checkAnswer() {
                if (!currentQuestion) return;
                const isCorrect = answer.value.trim().toLowerCase() === currentQuestion.expected.toLowerCase();
                feedback.className = `practice-feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                feedback.textContent = isCorrect
                    ? `Richtig: ${currentQuestion.expected}`
                    : `Noch einmal: ${currentQuestion.expected}`;
            }

            document.getElementById('practice-check').addEventListener('click', checkAnswer);
            document.getElementById('practice-next').addEventListener('click', newQuestion);
            answer.addEventListener('keydown', event => {
                if (event.key === 'Enter') checkAnswer();
            });

            const initialVerb = Object.keys(db)[0] || allLemmas[0];
            if (initialVerb) render(initialVerb);
            newQuestion();

            input.addEventListener('input', event => {
                const query = event.target.value.trim().toLowerCase();
                if (!query) return;
                const match = allLemmas.find(lemma => lemma.toLowerCase().startsWith(query) || lemma.toLowerCase() === query);
                if (match) render(match);
            });
        });
    </script>
