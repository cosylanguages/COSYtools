<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Հայերեն 🇦🇲 | COSYlanguages</title>
    <link rel="stylesheet" href="https://raw.githubusercontent.com/cosylanguages/COSYlanguages/ba14a13d3c32e84f5c8ebbabd2d8b85c060d04a4/css/cosy-tokens.css">
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/tool-lookup.css">
</head>
<body>
    <header class="app-header" data-icon="🇦🇲" data-title="Հայերեն" data-tagline="Armenian Case Engine"></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search...">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="result-display" class="result-card"></div>
    </main>
    <script src="../shared/js/languages.js"></script>
    <script src="../shared/js/engine.js"></script>
    <script>
        const dataFile = location.pathname.includes('cases') || location.pathname.includes('genus') || location.pathname.includes('genre') ? 'data/nouns.json' : 'data/verbs.json';
        fetch(dataFile).then(r => r.json()).then(db => {
            const input = document.getElementById('search-input');
            const display = document.getElementById('result-display');
            function render(v) {
                const item = db[v];
                if (!item) return;
                display.innerHTML = `<h2>${v} <span class="tag">${item.level || 'A1'}</span></h2><p><strong>Definition:</strong> ${item.definition || ''}</p><p><strong>Example:</strong> ${item.examples ? item.examples[0] : ''}</p>`;
            }
            const firstKey = Object.keys(db)[0];
            if (firstKey) render(firstKey);
            input.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (db[q]) render(q);
            });
        });
    </script>
</body>
</html>
