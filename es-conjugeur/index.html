<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugación Española 🇪🇸 | COSYlanguages</title>
    <link rel="stylesheet" href="https://raw.githubusercontent.com/cosylanguages/COSYlanguages/ba14a13d3c32e84f5c8ebbabd2d8b85c060d04a4/css/cosy-tokens.css">
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/tool-lookup.css">
</head>
<body>
    <header class="app-header" data-icon="🇪🇸" data-title="Conjugación Española" data-tagline="Spanish Verb Engine"></header>
    <main class="tool-container">
        <div class="search-box">
            <input type="text" id="verb-search-input" placeholder="Buscar verbo en español (ej. hablar, comer, vivir)...">
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div id="verb-display" class="result-card"></div>
    </main>
    <script src="../shared/js/languages.js"></script>
    <script src="../shared/js/engine.js"></script>
    <script>
        fetch('data/verbs.json').then(r => r.json()).then(db => {
            const input = document.getElementById('verb-search-input');
            const display = document.getElementById('verb-display');
            function render(v) {
                const item = db[v];
                if (!item) return;
                display.innerHTML = `<h2>${v} <span class="tag">${item.level}</span></h2><p><strong>Definición:</strong> ${item.definition}</p><p><strong>Ejemplo:</strong> ${item.examples[0]}</p>`;
            }
            render(Object.keys(db)[0]);
            input.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (db[q]) render(q);
            });
        });
    </script>
</body>
</html>
