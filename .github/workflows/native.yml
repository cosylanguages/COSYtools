name: Native Apps

on:
  push:
    paths:
      - 'native/**'
      - 'scripts/build-app.js'
      - 'scripts/generate-app-sources.js'
      - 'shared/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
      - 'catalog.json'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build-app.js'
      - 'scripts/generate-app-sources.js'
      - 'shared/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
      - 'catalog.json'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/native.yml'
  workflow_dispatch:

jobs:
  bundle:
    name: Verify web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install

      - name: Build native/www
        run: node scripts/build-app.js

      - name: Verify bundle is reproducible
        run: node scripts/build-app.js --check

      - name: Check Electron main process syntax
        run: node --check native/electron/main.js

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default "tools platform-tools" fails: Google removed the
          # obsolete "tools" package, so sdkmanager exits 1. platform-tools is
          # already preinstalled on the runner, so no extra packages are needed.
          packages: ''

      - name: Install root dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install

      - name: Build native/www
        run: node scripts/build-app.js

      - name: Install Capacitor dependencies
        working-directory: native/capacitor
        run: npm ci

      - name: Sync web bundle into the Android project
        working-directory: native/capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native/capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosytools-android-debug
          path: native/capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install

      - name: Build native/www
        run: node scripts/build-app.js

      - name: Generate desktop icon
        run: node scripts/generate-app-sources.js

      - name: Install Electron dependencies
        working-directory: native/electron
        run: npm ci

      - name: Package desktop app
        working-directory: native/electron
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cosytools-desktop-${{ matrix.os }}
          path: native/electron/dist/*.*
          if-no-files-found: warn
